name: Build and deploy

# A push to master only checks that the image builds. Publishing a GitHub release vX.Y.Z (the
# version in package.json) pushes the image as X.Y.Z, X.Y and latest and deploys it.
on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# Never run two deploys at the same time, finish the running one first
concurrency:
  group: ${{ github.event_name == 'release' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version matches the tag
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "package.json has $version, tag $GITHUB_REF_NAME"; exit 1; }

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/renautmestdagh/music-downloader
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # Calls the Komodo deploy webhook (GitHub-style HMAC signature), configured in the production environment's secrets
      - name: Trigger deploy webhook
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          body='{"ref":"refs/heads/main"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$URL" \
            -H 'content-type: application/json' -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" -d "$body")
          echo "webhook answered HTTP $code"
          [ "$code" = 200 ] || { cat response.txt; exit 1; }
